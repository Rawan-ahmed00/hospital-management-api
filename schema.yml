components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
        time:
          type: string
          format: time
        reason:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        patient:
          type: integer
        doctor:
          type: integer
      required:
      - created_at
      - date
      - doctor
      - id
      - patient
      - reason
      - time
    Department:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        description:
          type: string
        floor:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        phone:
          type: string
          maxLength: 20
        available:
          type: boolean
      required:
      - floor
      - id
      - name
      - phone
    Doctor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        specialty:
          $ref: '#/components/schemas/SpecialtyEnum'
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 254
        experience_years:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        available:
          type: boolean
      required:
      - email
      - id
      - name
      - phone
      - specialty
    GenderEnum:
      enum:
      - Male
      - Female
      type: string
      description: |-
        * `Male` - Male
        * `Female` - Female
    MedicalRecord:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        diagnosis:
          type: string
        symptoms:
          type: string
        treatment:
          type: string
        notes:
          type: string
        record_date:
          type: string
          format: date
          readOnly: true
        patient:
          type: integer
        doctor:
          type: integer
          nullable: true
      required:
      - diagnosis
      - id
      - patient
      - record_date
    Patient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        date_of_birth:
          type: string
          format: date
        gender:
          $ref: '#/components/schemas/GenderEnum'
        phone:
          type: string
          maxLength: 20
        email:
          type: string
          format: email
          maxLength: 254
        address:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        doctor:
          type: integer
          nullable: true
      required:
      - address
      - created_at
      - date_of_birth
      - email
      - gender
      - id
      - name
      - phone
    Register:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        email:
          title: Email address
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        password:
          type: string
          writeOnly: true
      required:
      - password
      - username
    SpecialtyEnum:
      enum:
      - Cardiology
      - Dentistry
      - Dermatology
      - Neurology
      - Pediatrics
      - Orthopedics
      - General
      type: string
      description: |-
        * `Cardiology` - Cardiology
        * `Dentistry` - Dentistry
        * `Dermatology` - Dermatology
        * `Neurology` - Neurology
        * `Pediatrics` - Pediatrics
        * `Orthopedics` - Orthopedics
        * `General` - General
    StatusEnum:
      enum:
      - Pending
      - Confirmed
      - Completed
      - Cancelled
      type: string
      description: |-
        * `Pending` - Pending
        * `Confirmed` - Confirmed
        * `Completed` - Completed
        * `Cancelled` - Cancelled
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
